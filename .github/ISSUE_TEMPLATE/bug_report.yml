name: Bug report
description: Something in the portal does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** use this form for security problems —
        see [SECURITY.md](https://github.com/HolgerHatGarKeineNode/einundzwanzig-app/blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See error
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The page the problem occurs on.
      placeholder: https://portal.einundzwanzig.space/de/meetups
    validations:
      required: false

  - type: dropdown
    id: where
    attributes:
      label: Where did you see this?
      options:
        - portal.einundzwanzig.space (production)
        - A national domain pointing at the portal
        - A local development installation
        - Somewhere else / not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Firefox 140 on Android 15 / Chrome 141 on macOS"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console output or error message
      description: Anything from the browser console or an error page. This is rendered as code, no backticks needed.
      render: shell
    validations:
      required: false
