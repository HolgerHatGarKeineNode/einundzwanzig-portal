version: 2

# composer.json requires livewire/flux-pro from a licensed repository. Without these
# credentials Dependabot cannot resolve the dependency graph and the composer updater stays
# silently dead. FLUX_USERNAME and FLUX_LICENSE_KEY have to exist as *Dependabot* secrets —
# Actions secrets are a separate store and are not visible here.
registries:
  flux-pro:
    type: composer-repository
    url: https://composer.fluxui.dev
    username: ${{ secrets.FLUX_USERNAME }}
    password: ${{ secrets.FLUX_LICENSE_KEY }}

updates:
  - package-ecosystem: "composer"
    directory: "/"
    registries:
      - flux-pro
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      php-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      js-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
