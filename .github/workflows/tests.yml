name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    env:
      FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
      FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # composer install pulls livewire/flux-pro from a licensed repository. Pull requests
      # from forks never receive secrets, so the job reports why it stopped instead of
      # failing with an unhelpful 403 from composer.fluxui.dev.
      - name: Check for Flux Pro credentials
        id: flux
        run: |
          if [ -n "$FLUX_USERNAME" ] && [ -n "$FLUX_LICENSE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Tests skipped::No Flux Pro credentials available (fork pull request, or FLUX_USERNAME / FLUX_LICENSE_KEY not set). A maintainer has to run the suite for this change."
          fi

      - name: Setup PHP
        if: steps.flux.outputs.available == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_sqlite, sqlite3, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Cache composer packages
        if: steps.flux.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Authenticate with Flux Pro
        if: steps.flux.outputs.available == 'true'
        run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"

      - name: Install PHP dependencies
        if: steps.flux.outputs.available == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress --no-ansi

      - name: Prepare environment
        if: steps.flux.outputs.available == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate

      # Browser tests need a Playwright Chromium build and are excluded on purpose.
      - name: Run Unit and Feature tests
        if: steps.flux.outputs.available == 'true'
        run: php artisan test --compact --testsuite=Unit,Feature

  pint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2, pint

      # Pint runs standalone here so the style check also covers pull requests from forks,
      # which cannot install the licensed Flux Pro packages.
      - name: Check code style
        run: pint --test
