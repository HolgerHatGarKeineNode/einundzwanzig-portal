name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: Pest (PHP ${{ matrix.php }})

    # composer install pulls livewire/flux-pro from a licensed repository, so this job needs
    # the Flux credentials. GitHub never hands secrets to a workflow triggered by a fork or by
    # Dependabot — running there would produce a green check that tested nothing, which is
    # worse than no check at all. Those runs are skipped outright, so a required status check
    # stays unfulfilled instead of being satisfied by an empty job. A maintainer runs the suite
    # for such a pull request (see CONTRIBUTING.md).
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository
       && github.actor != 'dependabot[bot]')

    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails the job rather than skipping it: this run happens in a context that is supposed
      # to have the credentials, so a missing secret is a broken setup, not a reason to pass.
      - name: Require Flux Pro credentials
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
        run: |
          if [ -z "$FLUX_USERNAME" ] || [ -z "$FLUX_LICENSE_KEY" ]; then
            echo "::error title=Missing secrets::FLUX_USERNAME and FLUX_LICENSE_KEY are not set. composer install cannot resolve livewire/flux-pro, so the test suite cannot run."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_sqlite, sqlite3, sodium, zip
          coverage: none
          tools: composer:v2

      # No vendor cache on purpose. Anyone who can open a pull request can read the caches of
      # the base branch, and vendor/ holds the licensed Flux Pro packages.
      - name: Authenticate with Flux Pro
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
        run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-ansi

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Browser tests need a Playwright Chromium build and are excluded on purpose.
      - name: Run Unit and Feature tests
        run: php artisan test --compact --testsuite=Unit,Feature

  pint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2, pint

      # Pint runs from the standalone binary and never calls composer install, so pull requests
      # from forks get a style check without any repository code being executed.
      - name: Check code style
        run: pint --test
