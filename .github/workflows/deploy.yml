name: Deploy

# Replaces the former Gitea Actions workflow. Pushing to master pings the Laravel Forge
# deployment hook stored in the TRIGGER_URL secret of the "production" environment.
on:
  push:
    branches: [master]
  workflow_dispatch:

# The job checks nothing out and only calls curl.
permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    name: Trigger Forge deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'HolgerHatGarKeineNode/einundzwanzig-app'
    environment:
      name: production
      url: https://portal.einundzwanzig.space

    steps:
      - name: Ping Forge deployment hook
        env:
          TRIGGER_URL: ${{ secrets.TRIGGER_URL }}
        run: |
          if [ -z "$TRIGGER_URL" ]; then
            echo "::error title=Missing secret::TRIGGER_URL is not set on the production environment — the Forge deployment hook cannot be called."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$TRIGGER_URL"
          echo "Deployment triggered for ${{ github.sha }}."
