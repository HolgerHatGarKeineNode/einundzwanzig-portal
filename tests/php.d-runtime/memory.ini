; Speichergrenze fuer ALLE PHP-Prozesse eines Testlaufs.
;
; Warum eine Datei und kein "-d memory_limit=..." im composer-Script:
; "artisan test" forkt den eigentlichen Pest-Prozess, und ein -d-Flag wird an
; Kindprozesse NICHT vererbt. Gemessen am Prozessbaum eines laufenden
; "composer test" (2026-08-07):
;
;   php -d memory_limit=512M artisan test --fresh   <- Flag nur hier
;    +- php vendor/pestphp/pest/bin/pest --fresh    <- KEIN Flag, 128M Default
;        +- php -d pcov.directory=... pest          <- KEIN Flag
;
; Die Tests laufen in der untersten Ebene, und genau dort brach die Suite mit
; "Allowed memory size of 134217728 bytes exhausted" ab (134217728 = 128M).
; PHP_INI_SCAN_DIR ist dagegen eine Env-Variable und wird vererbt; dieses
; Fragment liegt bewusst NICHT in tests/php.d, damit der Coverage-Treiber
; (pcov.enabled=1) nicht bei jedem Lauf mitgeladen wird.
memory_limit=512M

; Grenze dieses Wegs: PHP_INI_SCAN_DIR steht hier RELATIV. PHP loest den Pfad
; gegen das CWD des jeweiligen Prozesses auf — gemessen: im Repo-Root 512M,
; aus einem fremden CWD wieder 128M. Composer-Scripts laufen im Repo-Root und
; vererben das CWD an ihre Kinder, deshalb traegt es hier. Wer den Testlauf
; aus einem anderen Verzeichnis startet, faellt still auf den Default zurueck.
