; Repo-lokales INI-Fragment fuer den Coverage-Treiber der Testsuite.
;
; Wird NICHT global geladen. Es wird ausschliesslich ueber
; PHP_INI_SCAN_DIR=":<repo>/tests/php.d" in den Prozessbaum eines
; Pest-Laufs eingehaengt (siehe tests/tia-coverage-driver.php).
;
; Warum ueberhaupt eine Datei und nicht nur "php -d pcov.enabled=1":
; pcov.enabled ist PHP_INI_SYSTEM und laesst sich zur Laufzeit nicht
; per ini_set() setzen. Ein "-d"-Flag gilt zudem nur fuer genau einen
; Prozess und wird an Kindprozesse (Paratest-Worker, von Tests
; gestartete artisan-Aufrufe) NICHT vererbt — eine Env-Variable schon.
pcov.enabled=1
